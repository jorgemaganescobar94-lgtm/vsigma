name: vSIGMA Safe Key Fingerprint Diagnostic

on:
  push:
    paths:
      - ".github/workflows/vsigma_key_fingerprint_diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare-safe CI key fingerprint
        shell: python
        env:
          VSIGMA_ENV_B64: ${{ secrets.VSIGMA_ENV_B64 }}
        run: |
          import base64
          import hashlib
          import os

          raw = os.environ.get("VSIGMA_ENV_B64", "")
          if not raw:
              raise SystemExit("ERROR: VSIGMA_ENV_B64 missing")
          decoded = base64.b64decode(raw).decode("utf-8")
          values = {}
          for line in decoded.splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip().strip("'").strip('"')
          secret = values.get("API_FOOTBALL_KEY", "")
          if not secret:
              raise SystemExit("ERROR: API_FOOTBALL_KEY missing inside VSIGMA_ENV_B64")
          fingerprint = hashlib.sha256(secret.encode()).hexdigest()[:12]
          print(f"CI_API_KEY_SHA256_12={fingerprint}")
          print("SAFE_DIAGNOSTIC=key_not_printed")

